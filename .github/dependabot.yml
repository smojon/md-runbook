# Bumps the actions pinned by commit SHA in .github/workflows and action.yml. A new version waits
# 7 days, like the Expo updates (expo-updates.yml): a compromised release is usually pulled by then.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
