name: Web image
# The web app as a container (apps/web): built from the repository root the way the release
# builds it, started read-only, and asked for what a browser and a runbook link ask for.
on:
  push:
    branches: ['**']
    paths: ['apps/web/**', 'apps/mobile/**', 'packages/core/src/**', 'packages/ssh/src/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t md-runbook-web -f apps/web/Dockerfile .
      - name: Serves the app, its routes and its bundles
        run: |
          docker run -d --name web -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp --cap-drop ALL md-runbook-web
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ -o index.html
          grep -q '_expo/static/js' index.html
          # A runbook link (/open?...) and a runbook's page are the app too, with status 200.
          curl -fsS 'http://127.0.0.1:8080/open?url=https%3A%2F%2Fexample.net%2Fr.md' | cmp - index.html
          curl -fsS http://127.0.0.1:8080/runbook/x | cmp - index.html
          bundle="$(grep -o '/_expo/static/js/[^"]*\.js' index.html | head -1)"
          curl -fsSI "http://127.0.0.1:8080$bundle" | tee headers.txt
          grep -qi 'cache-control: public, max-age=31536000, immutable' headers.txt
          test "$(docker inspect -f '{{.Config.User}}' md-runbook-web)" != root
      - name: Serves a team library as JSON listings, and none without one
        run: |
          # No runbooks/ folder: 404, which the app takes as no library (not the app's page).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/runbooks/)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/runbooks/index.json)" = 404
          mkdir -p lib/ops lib/.git
          printf '# Hello\n' > lib/hello.md
          printf '# Restore\n' > lib/ops/restore.md
          # Hidden files (a git checkout, an .env) and a link out of the folder: never served.
          printf '[core]\n' > lib/.git/config
          printf 'TOKEN=secret\n' > lib/.env
          printf '# Hidden\n' > lib/ops/.draft.md
          chmod -R a+rX lib
          ln -s /etc/passwd lib/passwd.md
          docker run -d --name web-lib -p 127.0.0.1:8081:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            -v "$PWD/lib:/usr/share/nginx/html/runbooks:ro" md-runbook-web
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8081/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:8081/runbooks/ | tee listing.json
          jq -e 'map(.name) | (index("hello.md") != null) and (index("ops") != null)' listing.json
          jq -e '.[] | select(.name == "ops") | .type == "directory"' listing.json
          curl -fsS http://127.0.0.1:8081/runbooks/ops/ | jq -e '.[0].name == "restore.md" and .[0].type == "file"'
          curl -fsS -D headers-lib.txt http://127.0.0.1:8081/runbooks/hello.md | grep -q '^# Hello'
          grep -qi '^content-type: text/markdown' headers-lib.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/runbooks/nothing.md)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/runbooks/.git/config)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/runbooks/.git/)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/runbooks/.env)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/runbooks/ops/.draft.md)" = 404
          # The link to /etc/passwd (another owner than the link): refused, whatever the status.
          code="$(curl -s -o passwd.out -w '%{http_code}' http://127.0.0.1:8081/runbooks/passwd.md)"
          test "$code" != 200
          ! grep -q '^root:' passwd.out
      - name: Writes /config.json from the environment, with no secrets; serves the library at MD_RUNBOOK_LIBRARY
        run: |
          # Without settings: the default library folder only, as JSON, read again on every visit.
          curl -fsS -D headers-config.txt http://127.0.0.1:8080/config.json | tee config.json
          jq -e '. == {"library": "/runbooks/"}' config.json
          grep -qi '^content-type: application/json' headers-config.txt
          grep -qi '^cache-control: no-cache' headers-config.txt
          mkdir -p sop/.git
          printf '# Restart\n' > sop/restart.md
          printf '[core]\n' > sop/.git/config
          chmod -R a+rX sop
          docker run -d --name web-config -p 127.0.0.1:8082:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            -e MD_RUNBOOK_PUBLIC_URL=https://runbooks.example.net/ -e MD_RUNBOOK_LIBRARY=/sop/ \
            -e RELAY_TOKEN=do-not-leak-this \
            -v "$PWD/sop:/usr/share/nginx/html/sop:ro" md-runbook-web
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8082/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:8082/config.json | tee config-set.json
          jq -e '. == {"publicUrl": "https://runbooks.example.net", "library": "/sop/"}' config-set.json
          # Only the two settings: never a token or any other variable of the container.
          ! grep -qi 'token\|do-not-leak' config-set.json
          # The library at /sop/, with the library's rules (JSON listing, hidden files 404).
          curl -fsS http://127.0.0.1:8082/sop/ | jq -e 'map(.name) | index("restart.md") != null'
          curl -fsS -D headers-sop.txt http://127.0.0.1:8082/sop/restart.md | grep -q '^# Restart'
          grep -qi '^content-type: text/markdown' headers-sop.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/sop/.git/config)" = 404
          # The app's routes are still the app.
          curl -fsS 'http://127.0.0.1:8082/open?url=https%3A%2F%2Fexample.net%2Fr.md' | grep -q '_expo/static/js'
          # A value that isn't valid stops the container (not a server that hands out wrong links).
          for bad in 'MD_RUNBOOK_PUBLIC_URL=http://runbooks.example.net' 'MD_RUNBOOK_PUBLIC_URL=https://x.example.net/?a=1' \
                     'MD_RUNBOOK_LIBRARY=/../etc/' 'MD_RUNBOOK_LIBRARY=/runbook/x/'; do
            set +e
            timeout 30 docker run --rm --read-only --tmpfs /tmp --cap-drop ALL -e "$bad" md-runbook-web
            code=$?
            set -e
            test "$code" != 0 && test "$code" != 124
          done
      - name: Web server log
        if: always()
        run: |
          docker logs web || true
          docker logs web-lib || true
          docker logs web-config || true
