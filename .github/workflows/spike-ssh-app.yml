name: Spike SSH app
# Spike step C: the SSH shell code in a React Native (Expo) app, on an Android emulator, against
# a throwaway sshd on the runner. Not part of the extension's build or release.
on:
  push:
    branches: ['spike/**']
    paths: ['spikes/ssh/src/remoteShell.ts', 'spikes/ssh/app-src/**', 'spikes/ssh/ci/**', '.github/workflows/spike-ssh-app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Start a throwaway SSH server (port 2222, keys made here)
        run: |
          d="$RUNNER_TEMP/sshd"; mkdir -p "$d"; cd "$d"
          ssh-keygen -q -t ecdsa -b 256 -N '' -f host_ecdsa
          ssh-keygen -q -t ecdsa -b 256 -m PKCS8 -N '' -f client_ecdsa
          cp client_ecdsa.pub authorized_keys
          printf '%s\n' "Port 2222" "ListenAddress 127.0.0.1" "HostKey $d/host_ecdsa" "AuthorizedKeysFile $d/authorized_keys" \
            "PasswordAuthentication no" "KbdInteractiveAuthentication no" "UsePAM no" "StrictModes no" "PidFile $d/sshd.pid" > sshd_config
          /usr/sbin/sshd -f "$d/sshd_config" -E "$d/sshd.log"
      - name: Make the app
        env:
          SSH_KEY_FILE: ${{ runner.temp }}/sshd/client_ecdsa
          SSH_HOST_PUB: ${{ runner.temp }}/sshd/host_ecdsa.pub
          SSH_PORT: '2222'
        run: |
          export SSH_USER="$(whoami)"
          bash spikes/ssh/ci/make-app.sh "$RUNNER_TEMP/app"
      - name: Build the Android app (release, x86_64 for the emulator)
        working-directory: ${{ runner.temp }}/app
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon -q
          ls -la app/build/outputs/apk/release/
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash spikes/ssh/ci/android-run.sh ${{ runner.temp }}/app/android/app/build/outputs/apk/release/app-release.apk
      - name: sshd log
        if: always()
        run: cat "$RUNNER_TEMP/sshd/sshd.log" || true
