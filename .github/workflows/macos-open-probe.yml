name: macOS open probe
# Investigation of runbooks that open slowly or never finish opening on macOS runners: the VS
# Code integration tests three times in parallel, each ending with the probe's summary
# (test/integration/probe.ts: event-loop stalls and CPU of the extension host, the window's
# round trip, the extension's own open work).
on:
  push:
    branches: ['**']
    paths: ['test/integration/probe.ts', '.github/workflows/macos-open-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Integration tests with the open probe
        run: |
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string || true
          npm run test:integration 2>&1 | tee integration.log
      - name: Probe summary
        if: always()
        run: |
          grep -E '! opening|open probe:|^  [^ ].*: [0-9]+ ms, |stalls > 1 s|integration tests passed|✖' integration.log || true
