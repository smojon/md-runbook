name: Pages
# The web app on GitHub Pages, from a commit on main whose App workflow passed (or by hand).
# It only deploys to its own domain: the app keeps its SSH key in the origin's localStorage, and
# <user>.github.io is shared with every other Pages site of the account. Set the domain under
# Settings → Pages → Custom domain and the same origin as the repository variable
# WEB_APP_ORIGIN (https://app.example.net); until then the job is skipped.
on:
  workflow_run:
    workflows: [App]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs (security review, 2026-11-16): `build` runs npm and Expo with a read-only token and
# no cache; `deploy` holds the Pages and OIDC tokens and runs nothing of the repository.
jobs:
  build:
    if: vars.WEB_APP_ORIGIN != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      # No npm cache: the deployed app holds SSH keys, so it builds from the lock file alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      # One page: Pages answers unknown paths (/runbook/…) with 404.html, so that is the app too.
      - name: Web build
        run: |
          npx expo export --platform web
          cp dist/index.html dist/404.html
      # A team library, optional: runbooks in apps/mobile/public/runbooks are copied into the export
      # (Expo copies public/ to dist/). Pages lists no folders, so the app reads the library's
      # index.json: one is made from the .md files when the folder has none.
      # Only the library's own files are published (security review round 4): Pages serves an .html
      # or .js file there as a page or script on the app's own origin, where the SSH key lives.
      - name: Team library files
        run: |
          if [ -d dist/runbooks ]; then
            find dist/runbooks \( -type l -o \( -type f ! \( -name '*.md' -o -name '*.markdown' -o -name index.json -o -name allowed_signers \) \) \) -print -delete
          fi
      - name: Team library index
        run: |
          if [ -d dist/runbooks ] && [ ! -f dist/runbooks/index.json ]; then
            (cd dist/runbooks && find . -type f \( -name '*.md' -o -name '*.markdown' \) | sed 's|^\./||' | LC_ALL=C sort) \
              | jq -R . | jq -s '{runbooks: .}' > dist/runbooks/index.json
            cat dist/runbooks/index.json
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        id: pages
      - name: Pages serves the app's own domain
        env:
          ORIGIN: ${{ steps.pages.outputs.origin }}
          WANTED: ${{ vars.WEB_APP_ORIGIN }}
        run: |
          echo "Pages origin: $ORIGIN"
          test "$ORIGIN" = "$WANTED" || { echo "::error::Pages serves $ORIGIN, not WEB_APP_ORIGIN ($WANTED)"; exit 1; }
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deploy
