name: Expo updates
# Daily: has Expo published patch releases of the packages the app uses (apps/mobile)? They are
# not a change here, so they are not a check on pushes and pull requests (the App workflow's
# expo-doctor skips its version check; check-deps.mjs still fails on a minor or major mismatch).
# This job looks every day and takes a release once it is 7 days old (e2e/expo-updates.mjs: a
# compromised release is usually pulled within days; the rule of anotherMoney's
# minimumReleaseAge). It updates them on the branch `expo-updates`, exact pins kept, starts the
# App and CI workflows on it, and opens one pull request, or updates the one that is open. Merge
# it when its checks are green. What is held, and until when, is in the run's summary.
#
# Two jobs (security review, 2026-11-16): `update` installs the new releases with a read-only
# token, no token in git's config and no install scripts, so a compromised package can't push or
# start workflows. `push` has the write token and installs nothing (only `npm ls` reads the lock):
# it commits the two files `update` made.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-updates
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/mobile

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # npm ci and expo-updates.mjs's npm install: no package's install script runs here.
      npm_config_ignore_scripts: 'true'
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund

      - name: Are Expo patch releases out?
        id: check
        run: |
          if npx expo install --check > "$RUNNER_TEMP/check.txt" 2>&1; then
            echo "The Expo packages are the versions the SDK expects."
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/check.txt"
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the ones at least 7 days old, exact pins kept
        id: update
        if: steps.check.outputs.outdated == 'true'
        run: |
          node e2e/expo-updates.mjs "$RUNNER_TEMP/check.txt" "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- package.json package-lock.json; then
            echo "Nothing is 7 days old yet."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            mkdir -p "$RUNNER_TEMP/update"
            cp package.json package-lock.json "$RUNNER_TEMP/summary.md" "$RUNNER_TEMP/update/"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        if: steps.update.outputs.changed == 'true'
        with:
          name: expo-update
          path: ${{ runner.temp }}/update/
          if-no-files-found: error
          retention-days: 3

  push:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the branch
      pull-requests: write # open the pull request (Settings: Actions may create pull requests)
      actions: write # start App and CI on it: a push with this token starts no workflow by itself
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: expo-updates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      # By the ID the update job uploaded: no other job of the run can swap it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.update.outputs.artifact_id }}
          path: ${{ runner.temp }}/update
      # The update job ran npm, so its files are checked: only the versions the summary names
      # changed in package.json, and only their dependencies in the lock file, each as
      # registry.npmjs.org has it (tarball URL, integrity, dependencies, engines, bin, no new
      # install script) and published at least 7 days ago.
      # The pull request's title, commit and body take only clean.md: the list rebuilt from the
      # checked names and versions. No other text of the summary.
      - name: The update changes only what its summary says
        run: |
          # Only the two files: anything else the update job left is not taken.
          cp "$RUNNER_TEMP/update/package.json" "$RUNNER_TEMP/update/package-lock.json" .
          cp "$RUNNER_TEMP/update/summary.md" "$RUNNER_TEMP/summary.md"
          node ../../.github/scripts/check-expo-update.mjs "$RUNNER_TEMP/summary.md" "$RUNNER_TEMP/clean.md"
          # The tree from the lock alone (no node_modules here, nothing runs): every version must
          # fit the range that asks for it.
          npm ls --all --package-lock-only > /dev/null
      - name: Push the branch and open or update the pull request
        run: |
          # "- `expo` 58.0.19 → **58.0.21**" -> "expo 58.0.21"
          list=$(sed -nE 's/^- `([^`]+)` [^ ]+ → \*\*([^*]+)\*\*.*/\1 \2/p' "$RUNNER_TEMP/clean.md")
          first=$(echo "$list" | head -3 | paste -sd, - | sed 's/,/, /g')
          more=''
          if [ "$(echo "$list" | wc -l)" -gt 3 ]; then more=', …'; fi
          title="App: Expo SDK patch releases ($first$more)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git commit -q -am "$title" -m "$(printf 'Found by the daily Expo updates workflow (e2e/expo-updates.mjs):\n\n%s' "$(cat "$RUNNER_TEMP/clean.md")")"
          # The same update as the open pull request already has: nothing to do.
          if git fetch -q origin "$BRANCH" 2>/dev/null && git diff --quiet "origin/$BRANCH" -- package.json package-lock.json; then
            echo "The branch $BRANCH already has these versions."
            exit 0
          fi
          git push -q --force origin "$BRANCH"
          body=$(printf 'Expo patch releases of the packages the app uses, taken once they are 7 days old:\n\n%s\n\nInstalled with `npm install --before` (their dependencies are 7 days old too), exact pins kept. The App and CI workflows run on this branch; merge when they are green. If the audit step fails on a reviewed advisory that no longer applies, remove it from `e2e/audit.mjs` here. Opened by the daily Expo updates workflow, which updates this pull request when newer releases are old enough.' "$(cat "$RUNNER_TEMP/clean.md")")
          number=$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
          fi
          gh workflow run app.yml --ref "$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
