name: Release
# Push a tag like v0.1.0 (matching package.json "version") to test, package and publish.
on:
  push:
    tags: ['v*']

# Read-only by default: the test jobs run dependencies and downloaded VS Code builds, so they get
# no write token; only the publish jobs do, one credential each.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

  # The ops host (apps/ops), the probe (apps/probe), the relay (apps/relay), the web app
  # (apps/web) and the library server (apps/library-server) for amd64 and arm64, as ghcr.io/OWNER/md-runbook-ops:VERSION and :latest (the
  # others the same). The first push makes a private package: set it to public once in the
  # package's settings.
  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {image: md-runbook-ops, context: apps}
          - {image: md-runbook-probe, context: apps}
          - {image: md-runbook-relay, context: apps/relay}
          - {image: md-runbook-library-server, context: .}
          - {image: md-runbook-web, context: .}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub's registry
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build and push
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE"
          version="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/amd64,linux/arm64 -f "apps/${IMAGE#md-runbook-}/Dockerfile" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            -t "$image:$version" -t "$image:latest" --push "$CONTEXT"

  # Publishing is split by credential (security review, 2026-11-16). `package` runs the
  # repository's dependencies with no secret and no write token. Each publish job then gets one
  # credential and runs no dependency of the repository: npm publishes the packed folder, and
  # Open VSX and the Marketplace use their tools locked in scripts/publish-tools, installed
  # without install scripts.
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Package
        run: npx vsce package --no-dependencies --out md-runbook.vsix
      - name: Lay out the npm package
        run: |
          node scripts/build.js
          node scripts/pack-cli.js
      # The command line's npm package as a file too: `npm install -g <its URL>` installs it without
      # the npm registry (the dev container feature does that, devcontainer-features/).
      - name: The command line as a package file
        run: |
          (cd out/npm && npm pack --silent)
          cp out/npm/md-runbook-*.tgz md-runbook-cli.tgz
          rm out/npm/md-runbook-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: |
            md-runbook.vsix
            md-runbook-cli.tgz
            out/npm/
          if-no-files-found: error
          retention-days: 7

  npm:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing and provenance: no npm token, and the package links back to this run
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-files
      # Trusted publishing (PUBLISHING.md, npm): npm trades this run's GitHub OIDC token for a
      # one-time publish token, so no npm token is stored. It needs npm 11.5.1 or newer.
      - name: npm with trusted publishing
        run: npm install -g npm@11.6.2
      # Keep the `./`: without it npm reads `out/npm` as a GitHub repository.
      - name: Publish the command line to npm
        run: npm publish ./out/npm --access public --provenance

  open-vsx:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/publish-tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/publish-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-files
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: scripts/publish-tools/node_modules/.bin/ovsx publish md-runbook.vsix --skip-duplicate

  marketplace:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/publish-tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/publish-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-files
      # Off while VSCE_PAT isn't set: the Marketplace upload is by hand.
      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: scripts/publish-tools/node_modules/.bin/vsce publish --packagePath md-runbook.vsix

  # The Android APK, built and signed by app-apk.yml (its jobs keep the key away from the build).
  apk:
    needs: test
    uses: ./.github/workflows/app-apk.yml
    secrets: inherit

  # Made with every file at once: a published release is immutable (Settings → General).
  github-release:
    needs: [package, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: md-runbook-android
          path: ${{ runner.temp }}/release
      - name: GitHub release with the .vsix and the command line
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release"
          gh release create "$GITHUB_REF_NAME" md-runbook.vsix md-runbook-cli.tgz md-runbook-*.apk --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file <(node "$GITHUB_WORKSPACE/scripts/release-notes.js" "$GITHUB_REF_NAME") --prerelease
