name: Release
# Push a tag like v0.1.0 (matching package.json "version") to test, package and publish.
on:
  push:
    tags: ['v*']

# Read-only by default: the test jobs run dependencies and downloaded VS Code builds, so they get
# no write token; only the publish job does.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

  # The ops host image (apps/ops) for amd64 and arm64, as ghcr.io/OWNER/md-runbook-ops:VERSION and
  # :latest. The first push makes a private package: set it to public once in the package's settings.
  ops-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub's registry
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/md-runbook-ops"
          version="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/amd64,linux/arm64 -f apps/ops/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            -t "$image:$version" -t "$image:latest" --push apps

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance: the package links back to this workflow run
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Package
        run: npx vsce package --no-dependencies --out md-runbook.vsix
      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath md-runbook.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@0.10.6 publish md-runbook.vsix
      # Built without the npm token in the environment; only `npm publish` gets it.
      - name: Lay out the npm package
        run: |
          node scripts/build.js
          node scripts/pack-cli.js
      - name: Publish the command line to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish out/npm --access public --provenance
      - name: GitHub release with the .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" md-runbook.vsix --title "$GITHUB_REF_NAME" --notes-file <(node scripts/release-notes.js "$GITHUB_REF_NAME") --prerelease
