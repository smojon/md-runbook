name: Release
# Push a tag like v0.1.0 (matching package.json "version") to test, package and publish.
on:
  push:
    tags: ['v*']

# Read-only by default: the test jobs run dependencies and downloaded VS Code builds, so they get
# no write token; only the publish jobs do, one credential each.
permissions:
  contents: read

# No job here restores a cache: setup-node gets no `cache` and `package-manager-cache: false`
# (its automatic npm cache), so a release installs only what the lock files name.
jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      # The Go gate for its protocol tests (test/gate.test.ts, in npm test), on Linux and macOS.
      # go.mod's toolchain line, exactly: go-version-file reads only its `go` line (1.26 = newest).
      - id: go
        run: echo "version=$(sed -n 's/^toolchain go//p' apps/gate/go.mod)" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}
        shell: bash
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: runner.os != 'Windows'
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - name: Build the gate
        if: runner.os != 'Windows'
        run: |
          sh scripts/ci/build-gate.sh apps/gate/dist/md-runbook-gate
          echo "MD_RUNBOOK_GATE_BIN=$GITHUB_WORKSPACE/apps/gate/dist/md-runbook-gate" >> "$GITHUB_ENV"
      - run: npm test
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

  # The ops host (apps/ops), the probe (apps/probe), the relay (apps/relay), the web app
  # (apps/web) and the library server (apps/library-server) for amd64 and arm64, as ghcr.io/OWNER/md-runbook-ops:VERSION and :latest (the
  # others the same). The first push makes a private package: set it to public once in the
  # package's settings. Built without a build cache (no cache-from).
  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {image: md-runbook-ops, context: apps}
          - {image: md-runbook-probe, context: apps}
          - {image: md-runbook-relay, context: apps/relay}
          - {image: md-runbook-library-server, context: .}
          - {image: md-runbook-web, context: .}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub's registry
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build and push
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE"
          version="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/amd64,linux/arm64 -f "apps/${IMAGE#md-runbook-}/Dockerfile" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            -t "$image:$version" -t "$image:latest" --push "$CONTEXT"

  # Publishing is split by credential (security review, 2026-11-16). `package` runs the
  # repository's dependencies with no secret and no write token. Each publish job then gets one
  # credential and runs no dependency of the repository: npm publishes the packed folder, and
  # Open VSX and the Marketplace use their tools locked in scripts/publish-tools, installed
  # without install scripts.
  #
  # The publish jobs take the artifact by the ID `package` uploaded (a parallel job can't swap
  # it), download it under $RUNNER_TEMP (never over the checked-out tools), and check that it
  # holds the release files and nothing else before using it.
  package:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Package
        run: npx vsce package --no-dependencies --out md-runbook.vsix
      - name: Lay out the npm package
        run: |
          node scripts/build.js
          node scripts/pack-cli.js
      # The command line's npm package as a file too: `npm install -g <its URL>` installs it without
      # the npm registry (the dev container feature does that, devcontainer-features/).
      - name: The command line as a package file
        run: |
          (cd out/npm && npm pack --silent)
          cp out/npm/md-runbook-*.tgz md-runbook-cli.tgz
          rm out/npm/md-runbook-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        with:
          name: release-files
          path: |
            md-runbook.vsix
            md-runbook-cli.tgz
            out/npm/
          if-no-files-found: error
          retention-days: 7

  # md-runbook-gate for servers: md-runbook-gate-<goos>-<goarch> for Linux and macOS on amd64 and
  # arm64, and their SHA256SUMS. Like `package`: no secret and no write token. Built by
  # scripts/ci/build-gate.sh (static, -trimpath, no build ID, only go.mod's toolchain), so the
  # same tag gives the same bytes. github-release attaches them.
  gate:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      GOTOOLCHAIN: local # the toolchain go.mod names, which setup-go installs; never a download by go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # go.mod's toolchain line, exactly: go-version-file reads only its `go` line (1.26 = newest).
      - id: go
        run: echo "version=$(sed -n 's/^toolchain go//p' apps/gate/go.mod)" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}
        shell: bash
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - name: Vet and test
        working-directory: apps/gate
        run: |
          go vet ./...
          go test ./...
      - name: Build for Linux and macOS, amd64 and arm64
        run: |
          out="$RUNNER_TEMP/gate"
          mkdir -p "$out"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            sh scripts/ci/build-gate.sh "$out/md-runbook-gate-$os-$arch" "$os" "$arch"
            # Static, from the pinned toolchain: what `go version -m` says the binary was built with.
            info=$(go version -m "$out/md-runbook-gate-$os-$arch")
            echo "$info" | grep -qx "[[:space:]]*build[[:space:]]*CGO_ENABLED=0" || { echo "::error::$os/$arch: not CGO_ENABLED=0"; exit 1; }
            echo "$info" | head -n 1
          done
          cd "$out"
          sha256sum md-runbook-gate-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        with:
          name: gate-binaries
          path: ${{ runner.temp }}/gate/
          if-no-files-found: error
          retention-days: 7

  npm:
    needs: package
    runs-on: ubuntu-latest
    # npm's trusted publisher names this environment too (PUBLISHING.md, npm).
    environment: release
    permissions:
      id-token: write # npm trusted publishing and provenance: no npm token, and the package links back to this run
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: ${{ runner.temp }}/release
      - name: The artifact holds the release files and nothing else
        working-directory: ${{ runner.temp }}/release
        run: &check-release-files |
          got=$(find . -mindepth 1 ! -type d | LC_ALL=C sort)
          want=$(printf '%s\n' ./md-runbook-cli.tgz ./md-runbook.vsix ./out/npm/LICENSE ./out/npm/README.md ./out/npm/cli.js ./out/npm/package.json | LC_ALL=C sort)
          if [ "$got" != "$want" ]; then
            echo "::error::release-files is not the expected files"
            diff <(echo "$want") <(echo "$got") || true
            exit 1
          fi
      # npm publish runs the package's prepublishOnly, prepack, prepare, postpack, publish and
      # postpublish scripts (docs.npmjs.com/cli/v11/using-npm/scripts) next to the id-token, and
      # reads publishConfig (another registry, tag or access). So package.json has exactly the keys
      # scripts/pack-cli.js writes (keep the two in step), with this tag's version and our bin.
      - name: The package has what scripts/pack-cli.js writes, nothing more
        working-directory: ${{ runner.temp }}/release
        run: |
          want='["author","bin","bugs","description","engines","files","homepage","keywords","license","name","repository","version"]'
          if ! jq -e --argjson want "$want" --arg version "${GITHUB_REF_NAME#v}" '
              (keys == $want) and .name == "md-runbook" and .version == $version
              and .bin == {"md-runbook": "cli.js"} and .files == ["cli.js", "README.md", "LICENSE"]' \
              out/npm/package.json > /dev/null; then
            echo "::error::out/npm/package.json is not what scripts/pack-cli.js writes: keys $(jq -c keys out/npm/package.json)"
            exit 1
          fi
      # Trusted publishing (PUBLISHING.md, npm): npm trades this run's GitHub OIDC token for a
      # one-time publish token, so no npm token is stored. It needs npm 11.5.1 or newer.
      - name: npm with trusted publishing
        run: npm install -g --ignore-scripts npm@11.6.2
      # Keep the `./`: without it npm reads `out/npm` as a GitHub repository. --ignore-scripts:
      # no lifecycle script runs with the id-token (docs.npmjs.com/cli/v11/using-npm/config).
      - name: Publish the command line to npm
        working-directory: ${{ runner.temp }}/release
        run: npm publish ./out/npm --access public --provenance --ignore-scripts

  open-vsx:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/publish-tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/publish-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: ${{ runner.temp }}/release
      - name: The artifact holds the release files and nothing else
        working-directory: ${{ runner.temp }}/release
        run: *check-release-files
      - name: Publish to Open VSX
        working-directory: ${{ runner.temp }}/release
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: '"$GITHUB_WORKSPACE/scripts/publish-tools/node_modules/.bin/ovsx" publish md-runbook.vsix --skip-duplicate'

  marketplace:
    needs: package
    runs-on: ubuntu-latest
    # Its own environment, which the Marketplace's policy names (PUBLISHING.md): npm's trusted
    # publisher checks the environment, not the job, so in `release` this job's OIDC token could
    # be traded for an npm publish token, and the npm job's for a Marketplace one (review 2026-11-16).
    environment: release-marketplace
    permissions:
      contents: read
      id-token: write # Marketplace trusted publishing: no VSCE_PAT; the token lives 15 minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/publish-tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/publish-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: ${{ runner.temp }}/release
      - name: The artifact holds the release files and nothing else
        working-directory: ${{ runner.temp }}/release
        run: *check-release-files
      # Trusted publishing (vsce 4.1+ --oidc): the policy on the publisher page names this repository,
      # release.yml and the environment `release`. Off until the repository variable
      # MARKETPLACE_TRUSTED_PUBLISHING is `true` (set once the policy exists). Until then: upload by hand.
      - name: Publish to the Visual Studio Marketplace
        working-directory: ${{ runner.temp }}/release
        if: vars.MARKETPLACE_TRUSTED_PUBLISHING == 'true'
        run: '"$GITHUB_WORKSPACE/scripts/publish-tools/node_modules/.bin/vsce" publish --oidc --packagePath md-runbook.vsix'

  # The Android APK, built and signed by app-apk.yml (its jobs keep the key away from the build).
  # Only the two signing secrets are passed, not `secrets: inherit` (PUBLISHING.md, Android).
  apk:
    needs: test
    uses: ./.github/workflows/app-apk.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  # Made with every file at once: a published release is immutable (Settings → General).
  github-release:
    needs: [package, apk, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.apk.outputs.artifact_id }}
          path: ${{ runner.temp }}/apk
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.gate.outputs.artifact_id }}
          path: ${{ runner.temp }}/gate
      - name: The artifact holds the release files and nothing else
        working-directory: ${{ runner.temp }}/release
        run: *check-release-files
      - name: The APK artifact holds this version's APK and nothing else
        working-directory: ${{ runner.temp }}/apk
        run: |
          got=$(find . -mindepth 1 ! -type d)
          if [ "$got" != "./md-runbook-${GITHUB_REF_NAME#v}.apk" ]; then
            echo "::error::md-runbook-android is not md-runbook-${GITHUB_REF_NAME#v}.apk alone: $got"
            exit 1
          fi
      - name: The gate artifact holds the four binaries and their SHA256SUMS, nothing else
        working-directory: ${{ runner.temp }}/gate
        run: |
          got=$(find . -mindepth 1 ! -type d | LC_ALL=C sort)
          want=$(printf './%s\n' SHA256SUMS md-runbook-gate-darwin-amd64 md-runbook-gate-darwin-arm64 md-runbook-gate-linux-amd64 md-runbook-gate-linux-arm64 | LC_ALL=C sort)
          if [ "$got" != "$want" ]; then
            echo "::error::gate-binaries is not the expected files"
            diff <(echo "$want") <(echo "$got") || true
            exit 1
          fi
          test "$(wc -l < SHA256SUMS)" = 4
          sha256sum --strict -c SHA256SUMS
      - name: GitHub release with the .vsix, the command line, the APK and the gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release"
          gh release create "$GITHUB_REF_NAME" md-runbook.vsix md-runbook-cli.tgz "$RUNNER_TEMP/apk/md-runbook-${GITHUB_REF_NAME#v}.apk" \
            "$RUNNER_TEMP"/gate/md-runbook-gate-* "$RUNNER_TEMP/gate/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file <(node "$GITHUB_WORKSPACE/scripts/release-notes.js" "$GITHUB_REF_NAME") --prerelease
