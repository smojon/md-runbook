name: App APK
# A release APK of the app (apps/mobile) to install on an Android phone by hand: arm64-v8a, built
# from source like the emulator's in app.yml, then signed with the app's signing key (secrets
# ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD, alias md-runbook). A newer APK installs
# over an older one. Play gets the same key as its app signing key, so an APK install and a Play
# install update each other.
# - A tag vX.Y.Z: the Release workflow calls this one, and its release has md-runbook-X.Y.Z.apk
#   from the start (releases are immutable once published).
# - From the Actions tab (or `gh workflow run app-apk.yml --ref main`): the run's
#   "md-runbook-android" artifact. Only tags and main are signed; another branch gets the
#   unsigned build only.
#
# Two jobs, so the signing key never shares a runner with the build (security review,
# 2026-11-16). The build runs npm, Expo and Gradle, thousands of packages: any of them could
# replace apksigner or read the key. The sign job checks out nothing and installs nothing: it
# signs the build's APK with the runner's own Android SDK.
#
# The Release workflow passes the two signing secrets by name (no `secrets: inherit`). A secret
# passed by name works while it is a repository secret, and once it is only in the environment
# android-signing (docs.github.com, "Reuse workflows": "You can pass a secret by name even if it
# only exists in the environment").
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
    outputs:
      artifact_id:
        description: The ID of the md-runbook-android artifact (the signed APK)
        value: ${{ jobs.sign.outputs.artifact_id }}

permissions:
  contents: read

env:
  # The signing certificate's SHA-256: a wrong or missing key fails the run instead of shipping.
  CERT_SHA256: ccee870539e64ec11e08eda891d9eac9362e0e294a5def89c8aeb53427aece30

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          # A tag builds from the lock file alone, without the npm cache that other runs write.
          cache: ${{ github.ref_type != 'tag' && 'npm' || '' }}
          cache-dependency-path: apps/mobile/package-lock.json
          package-manager-cache: false
      # The Gradle cache is off whenever the sign job runs (tags and main): a signed APK is built
      # without what other runs wrote.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-disabled: ${{ github.ref_type == 'tag' || github.ref == 'refs/heads/main' }}
      - run: npm ci --no-audit --no-fund
      - name: Build the release APK (arm64-v8a)
        run: ABIS=arm64-v8a bash e2e/build-android.sh "$RUNNER_TEMP/apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        with:
          name: apk-unsigned
          path: ${{ runner.temp }}/apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Settings → Environments → android-signing can hold the two secrets and allow only v* tags
    # and main.
    environment: android-signing
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # By the ID the build uploaded: another job of the run can't swap the APK under this name.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/apk
      - name: The artifact holds the unsigned APK and nothing else
        working-directory: ${{ runner.temp }}/apk
        run: |
          got=$(find . -mindepth 1 ! -type d)
          if [ "$got" != ./app-release.apk ]; then
            echo "::error::apk-unsigned is not app-release.apk alone: $got"
            exit 1
          fi
      - name: Sign it with the app signing key
        working-directory: ${{ runner.temp }}/apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets are needed"
            exit 1
          fi
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # apksigner replaces the template's debug signature.
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias md-runbook --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD --out app-signed.apk app-release.apk
          rm -f "$ks"
          "$bt/apksigner" verify --print-certs app-signed.apk | tee certs.txt
          signers=$(grep -c 'certificate SHA-256 digest' certs.txt)
          if [ "$signers" != 1 ] || ! grep -q "certificate SHA-256 digest: $CERT_SHA256" certs.txt; then
            echo "::error::the APK is not signed by the app signing key alone (SHA-256 $CERT_SHA256)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="md-runbook-${GITHUB_REF_NAME#v}.apk"; else name="md-runbook-${GITHUB_SHA::7}.apk"; fi
          mv app-signed.apk "$name"
          rm -f certs.txt app-release.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        with:
          name: md-runbook-android
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error

