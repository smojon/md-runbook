name: App APK
# A release APK of the app (apps/mobile) to install on an Android phone by hand: arm64-v8a, built
# from source like the emulator's in app.yml and signed with the template's debug key, so a newer
# APK from this workflow installs over an older one. Run it from the Actions tab (or
# `gh workflow run app-apk.yml`); the APK is the run's "md-runbook-android" artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci --no-audit --no-fund
      - name: Build the release APK (arm64-v8a)
        run: ABIS=arm64-v8a bash e2e/build-android.sh "$RUNNER_TEMP/apk"
      - name: Name the APK after the commit
        run: mv "$RUNNER_TEMP/apk/app-release.apk" "$RUNNER_TEMP/apk/md-runbook-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: md-runbook-android
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
