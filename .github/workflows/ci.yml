name: CI
on:
  push:
    branches: ['**'] # not tags: the Release workflow tests tag pushes
  pull_request:
  workflow_dispatch: # the Expo updates workflow starts it on its branch (its push starts nothing)
jobs:
  # docs/features/lint.md, A whole repository: no tracked Markdown file gets harder to read than
  # .github/prose-baseline.json records, and a new one meets the rules (excludes: .md-runbook-prose.json).
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/build.js
      - name: 'Prose: no Markdown file gets harder to read'
        run: node out/dist/cli.js lint --prose-baseline .github/prose-baseline.json
  # md-runbook-gate (apps/gate, Go) on the two systems it runs on: formatting, vet, its own tests
  # and a release build. Its protocol tests (test/gate.test.ts) run against the binary in `test`,
  # and here on Linux with what `test` lacks: a systemd scope, bwrap and separated mode.
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local # the toolchain go.mod names, which setup-go installs; never a download by go
    defaults:
      run:
        working-directory: apps/gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # go.mod's toolchain line, exactly: go-version-file reads only its `go` line (1.26 = newest).
      - id: go
        run: echo "version=$(sed -n 's/^toolchain go//p' apps/gate/go.mod)" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}
        shell: bash
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: Build as a release does
        run: sh ../../scripts/ci/build-gate.sh dist/md-runbook-gate
      # The protocol tests in both modes, on a prepared system (Linux: macOS has neither a scope
      # nor bwrap). Isolation: a user manager for each account the gate runs as, and bwrap.
      # Separated mode: the gate's account with exactly the one sudoers line for a pool of 3
      # cells accounts, and an account with a wider rule that the self-check must refuse.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: runner.os == 'Linux'
        with:
          node-version: 22
      - name: Prepare accounts, the sudoers line, user managers and bwrap
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          set -eu
          # The gate in a folder only root can change, as the self-check asks (the runner image
          # leaves /usr/local/bin open for tool installs). Each folder up to / is checked.
          sudo install -d -m 755 -o root -g root /usr/libexec/md-runbook-gate /usr/libexec/md-runbook-gate/bin
          sudo install -m 755 -o root -g root apps/gate/dist/md-runbook-gate /usr/libexec/md-runbook-gate/bin/md-runbook-gate
          d=/usr/libexec/md-runbook-gate/bin
          while :; do
            set -- $(stat -c '%u %a' "$d")
            if [ "$1" != 0 ] || [ $((0$2 & 022)) -ne 0 ]; then
              echo "::error::$d: owner uid $1, mode $2: the gate's folders must be root's and writable by root alone"
              exit 1
            fi
            [ "$d" = / ] && break
            d=$(dirname "$d")
          done
          # And one in a folder anyone can write, which the self-check must refuse.
          sudo install -d -m 755 -o root -g root /usr/libexec/mdrb-open
          sudo install -d -m 777 -o root -g root /usr/libexec/mdrb-open/bin
          sudo install -m 755 -o root -g root apps/gate/dist/md-runbook-gate /usr/libexec/mdrb-open/bin/md-runbook-gate
          for a in mdrb-gate mdrb-wide mdrb-open; do sudo useradd -m -s /bin/sh "$a"; done
          # The cells accounts with no login shell, or the self-check refuses (the gate runs them
          # through sudo, never a login).
          for a in mdrb-cells-1 mdrb-cells-2 mdrb-cells-3; do sudo useradd -m -s /usr/sbin/nologin "$a"; done
          pool=mdrb-cells-1,mdrb-cells-2,mdrb-cells-3
          printf '%s\n' \
            "mdrb-gate ALL=($pool) NOPASSWD: /usr/libexec/md-runbook-gate/bin/md-runbook-gate __cells" \
            "mdrb-wide ALL=($pool) NOPASSWD: ALL" \
            "mdrb-open ALL=($pool) NOPASSWD: /usr/libexec/mdrb-open/bin/md-runbook-gate __cells" >"$RUNNER_TEMP/md-runbook-gate.sudoers"
          sudo visudo -cf "$RUNNER_TEMP/md-runbook-gate.sudoers"
          sudo install -m 440 "$RUNNER_TEMP/md-runbook-gate.sudoers" /etc/sudoers.d/md-runbook-gate
          sudo -n -u mdrb-gate sudo -n -l
          # The cells accounts may use neither cron nor at, or the self-check refuses.
          printf 'mdrb-cells-1\nmdrb-cells-2\nmdrb-cells-3\n' | sudo tee -a /etc/cron.deny /etc/at.deny >/dev/null
          # The README's DenyUsers line for the pool: this sshd's config check takes it, and its
          # parsed config lists an account of the pool (no login is tried).
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/deny_host"
          printf 'HostKey %s\nDenyUsers %s\n' "$RUNNER_TEMP/deny_host" "mdrb-cells-1 mdrb-cells-2 mdrb-cells-3" >"$RUNNER_TEMP/deny_sshd_config"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -t -f "$RUNNER_TEMP/deny_sshd_config"
          sudo /usr/sbin/sshd -T -f "$RUNNER_TEMP/deny_sshd_config" -C user=mdrb-cells-2,host=localhost,addr=127.0.0.1 | grep -Eq '^denyusers( .*)? mdrb-cells-2( |$)'
          # (/run/user/UID is that account's alone, mode 0700: root looks for the socket.)
          for a in "$(id -un)" mdrb-gate mdrb-wide; do
            sudo loginctl enable-linger "$a"
            sock="/run/user/$(id -u "$a")/systemd/private"
            i=0
            while ! sudo test -S "$sock" && [ "$i" -lt 60 ]; do sleep 0.5; i=$((i + 1)); done
            if ! sudo test -S "$sock"; then
              echo "::error::user manager of $a: no socket $sock after 30 seconds"
              sudo loginctl user-status "$a" --no-pager || true
              exit 1
            fi
            echo "user manager of $a: $sock"
          done
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap
          # Ubuntu 24.04 keeps unprivileged user namespaces to programs with an AppArmor profile.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --die-with-parent --new-session --unshare-pid --bind / / --dev-bind /dev /dev --proc /proc -- true
      - name: Protocol tests, shared and separated mode
        if: runner.os == 'Linux'
        working-directory: .
        timeout-minutes: 10
        env:
          MD_RUNBOOK_GATE_BIN: /usr/libexec/md-runbook-gate/bin/md-runbook-gate
          MD_RUNBOOK_GATE_ISOLATIONS: scope,bwrap
          MD_RUNBOOK_GATE_ACCOUNT: mdrb-gate
          MD_RUNBOOK_GATE_CELLS_ACCOUNTS: mdrb-cells-1 mdrb-cells-2 mdrb-cells-3
          MD_RUNBOOK_GATE_WIDE_ACCOUNT: mdrb-wide
          MD_RUNBOOK_GATE_OPEN_ACCOUNT: mdrb-open
          MD_RUNBOOK_GATE_OPEN_BIN: /usr/libexec/mdrb-open/bin/md-runbook-gate
        run: |
          npm ci
          npm run compile
          node --test --test-reporter=spec out/test/gate.test.js
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci
      # The Go gate for its protocol tests (test/gate.test.ts, in npm test) and the SSH tests
      # through it, on Linux and macOS.
      # go.mod's toolchain line, exactly: go-version-file reads only its `go` line (1.26 = newest).
      - id: go
        run: echo "version=$(sed -n 's/^toolchain go//p' apps/gate/go.mod)" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}
        shell: bash
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: runner.os != 'Windows'
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - name: Build the gate
        if: runner.os != 'Windows'
        run: |
          sh scripts/ci/build-gate.sh apps/gate/dist/md-runbook-gate
          echo "MD_RUNBOOK_GATE_BIN=$GITHUB_WORKSPACE/apps/gate/dist/md-runbook-gate" >> "$GITHUB_ENV"
      # Unit, round-trip, fuzz, redaction and shell smoke tests (pwsh + cmd natively on Windows).
      - run: npm test
      # The Expo updates workflow's check of what its update job made.
      - name: Workflow script tests
        if: runner.os == 'Linux'
        run: node --test .github/scripts/check-expo-update.test.mjs
      # @md-runbook/ssh against a real OpenSSH server (cancel, timeouts, reconnects, latency).
      - name: SSH tests
        if: runner.os != 'Windows'
        timeout-minutes: 5
        run: |
          bash scripts/ci/start-sshd.sh
          export MD_RUNBOOK_SSH_TEST="127.0.0.1:2222:$(id -un)"
          export MD_RUNBOOK_SSH_HOST_PUB="$RUNNER_TEMP/sshd/host_ecdsa.pub"
          export MD_RUNBOOK_SSH_AUTHORIZED_KEYS="$RUNNER_TEMP/sshd/authorized_keys"
          node --test --test-reporter=spec out/test/ssh.live.test.js || { cat "$RUNNER_TEMP/sshd/sshd.log"; exit 1; }
          # The server keeps running: the integration tests run host= cells on it (hosts.suite.ts).
          { echo "MD_RUNBOOK_SSH_TEST=$MD_RUNBOOK_SSH_TEST"; echo "MD_RUNBOOK_SSH_HOST_PUB=$MD_RUNBOOK_SSH_HOST_PUB"; echo "MD_RUNBOOK_SSH_AUTHORIZED_KEYS=$MD_RUNBOOK_SSH_AUTHORIZED_KEYS"; } >> "$GITHUB_ENV"
      # The same against Windows OpenSSH (cmd.exe as default shell): the app finds PowerShell there.
      - name: SSH tests (Windows server)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          ./scripts/ci/start-sshd-windows.ps1
          if ($LASTEXITCODE) { exit 1 }
          $env:MD_RUNBOOK_SSH_TEST = "127.0.0.1:2222:$env:USERNAME"
          $env:MD_RUNBOOK_SSH_HOST_PUB = "$env:RUNNER_TEMP\sshd\host_ecdsa.pub"
          $env:MD_RUNBOOK_SSH_AUTHORIZED_KEYS = "$env:RUNNER_TEMP\sshd\authorized_keys"
          node --test --test-reporter=spec out/test/ssh.windows.live.test.js
          if ($LASTEXITCODE) { Get-Content "$env:RUNNER_TEMP\sshd\sshd.log" -ErrorAction SilentlyContinue; exit 1 }
      - name: Lint the example runbooks
        if: runner.os == 'Linux'
        # The sample has a misspelled option on purpose (a warning); the others must be clean.
        run: |
          node out/dist/cli.js lint --strict examples/ci.runbook.md examples/screenshots.runbook.md examples/kubernetes.runbook.md
          node out/dist/cli.js lint examples/sample.runbook.md
      - name: Check the CI scripts
        if: runner.os == 'Linux'
        run: shellcheck -s sh -S warning scripts/ci/build-gate.sh
      # The command-line runner end to end, through this repository's own GitHub Action.
      - name: Run a runbook with the command line
        uses: ./
        with:
          runbook: examples/ci.runbook.md
          out: ${{ runner.temp }}/runbook/ci.runbook.md
          report: ${{ runner.temp }}/runbook/report.html
          pdf: ${{ runner.temp }}/runbook/report.pdf
          junit: ${{ runner.temp }}/runbook/junit.xml
      # The sample runbook still does what its text says (checks, retries, captures, os=, ...).
      - name: Check the sample runbook
        run: node scripts/check-sample.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: runbook-${{ matrix.os }}
          path: ${{ runner.temp }}/runbook/
      # End-to-end tests in a real VS Code.
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Package
        if: runner.os == 'Linux'
        run: npx vsce package --no-dependencies
      - name: Check the npm package of the command line
        if: runner.os == 'Linux'
        run: |
          node scripts/pack-cli.js
          (cd out/npm && npm pack --dry-run)
          node out/npm/cli.js --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: '*.vsix'
