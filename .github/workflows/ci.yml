name: CI
on:
  push:
    branches: ['**'] # not tags: the Release workflow tests tag pushes
  pull_request:
  workflow_dispatch: # the Expo updates workflow starts it on its branch (its push starts nothing)
jobs:
  # docs/features/lint.md, A whole repository: no tracked Markdown file gets harder to read than
  # .github/prose-baseline.json records, and a new one meets the rules (excludes: .md-runbook-prose.json).
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/build.js
      - name: 'Prose: no Markdown file gets harder to read'
        run: node out/dist/cli.js lint --prose-baseline .github/prose-baseline.json
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci
      # Unit, round-trip, fuzz, redaction and shell smoke tests (pwsh + cmd natively on Windows).
      - run: npm test
      # @md-runbook/ssh against a real OpenSSH server (cancel, timeouts, reconnects, latency).
      - name: SSH tests
        if: runner.os != 'Windows'
        timeout-minutes: 5
        run: |
          bash scripts/ci/start-sshd.sh
          export MD_RUNBOOK_SSH_TEST="127.0.0.1:2222:$(id -un)"
          export MD_RUNBOOK_SSH_HOST_PUB="$RUNNER_TEMP/sshd/host_ecdsa.pub"
          export MD_RUNBOOK_SSH_AUTHORIZED_KEYS="$RUNNER_TEMP/sshd/authorized_keys"
          node --test --test-reporter=spec out/test/ssh.live.test.js || { cat "$RUNNER_TEMP/sshd/sshd.log"; exit 1; }
      # The same against Windows OpenSSH (cmd.exe as default shell): the app finds PowerShell there.
      - name: SSH tests (Windows server)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          ./scripts/ci/start-sshd-windows.ps1
          if ($LASTEXITCODE) { exit 1 }
          $env:MD_RUNBOOK_SSH_TEST = "127.0.0.1:2222:$env:USERNAME"
          $env:MD_RUNBOOK_SSH_HOST_PUB = "$env:RUNNER_TEMP\sshd\host_ecdsa.pub"
          $env:MD_RUNBOOK_SSH_AUTHORIZED_KEYS = "$env:RUNNER_TEMP\sshd\authorized_keys"
          node --test --test-reporter=spec out/test/ssh.windows.live.test.js
          if ($LASTEXITCODE) { Get-Content "$env:RUNNER_TEMP\sshd\sshd.log" -ErrorAction SilentlyContinue; exit 1 }
      - name: Lint the example runbooks
        if: runner.os == 'Linux'
        # The sample has a misspelled option on purpose (a warning); the others must be clean.
        run: |
          node out/dist/cli.js lint --strict examples/ci.runbook.md examples/screenshots.runbook.md examples/kubernetes.runbook.md
          node out/dist/cli.js lint examples/sample.runbook.md
      # md-runbook-gate runs under any POSIX sh on the servers (dash, bash, busybox).
      - name: Check the gate script
        if: runner.os == 'Linux'
        run: shellcheck -s sh -S warning apps/gate/md-runbook-gate
      # The command-line runner end to end, through this repository's own GitHub Action.
      - name: Run a runbook with the command line
        uses: ./
        with:
          runbook: examples/ci.runbook.md
          out: ${{ runner.temp }}/runbook/ci.runbook.md
          report: ${{ runner.temp }}/runbook/report.html
          pdf: ${{ runner.temp }}/runbook/report.pdf
          junit: ${{ runner.temp }}/runbook/junit.xml
      # The sample runbook still does what its text says (checks, retries, captures, os=, ...).
      - name: Check the sample runbook
        run: node scripts/check-sample.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: runbook-${{ matrix.os }}
          path: ${{ runner.temp }}/runbook/
      # End-to-end tests in a real VS Code.
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Package
        if: runner.os == 'Linux'
        run: npx vsce package --no-dependencies
      - name: Check the npm package of the command line
        if: runner.os == 'Linux'
        run: |
          node scripts/pack-cli.js
          (cd out/npm && npm pack --dry-run)
          node out/npm/cli.js --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: '*.vsix'
