name: CI
on:
  push:
    branches: ['**'] # not tags: the Release workflow tests tag pushes
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # Unit, round-trip, fuzz, redaction and shell smoke tests (pwsh + cmd natively on Windows).
      - run: npm test
      # @md-runbook/ssh against a real OpenSSH server (cancel, timeouts, reconnects, latency).
      - name: SSH tests
        if: runner.os != 'Windows'
        run: |
          bash scripts/ci/start-sshd.sh
          export MD_RUNBOOK_SSH_TEST="127.0.0.1:2222:$(id -un)"
          export MD_RUNBOOK_SSH_HOST_PUB="$RUNNER_TEMP/sshd/host_ecdsa.pub"
          export MD_RUNBOOK_SSH_AUTHORIZED_KEYS="$RUNNER_TEMP/sshd/authorized_keys"
          node --test --test-reporter=spec out/test/ssh.live.test.js || { cat "$RUNNER_TEMP/sshd/sshd.log"; exit 1; }
      - name: Lint the example runbooks
        if: runner.os == 'Linux'
        # The sample has a misspelled option on purpose (a warning); the others must be clean.
        run: |
          node out/dist/cli.js lint --strict examples/ci.runbook.md examples/screenshots.runbook.md
          node out/dist/cli.js lint examples/sample.runbook.md
      # The command-line runner end to end, through this repository's own GitHub Action.
      - name: Run a runbook with the command line
        uses: ./
        with:
          runbook: examples/ci.runbook.md
          out: ${{ runner.temp }}/runbook/ci.runbook.md
          report: ${{ runner.temp }}/runbook/report.html
          pdf: ${{ runner.temp }}/runbook/report.pdf
          junit: ${{ runner.temp }}/runbook/junit.xml
      # The sample runbook still does what its text says (checks, retries, captures, os=, ...).
      - name: Check the sample runbook
        run: node scripts/check-sample.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runbook-${{ matrix.os }}
          path: ${{ runner.temp }}/runbook/
      # End-to-end tests in a real VS Code.
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Package
        if: runner.os == 'Linux'
        run: npx vsce package --no-dependencies
      - name: Check the npm package of the command line
        if: runner.os == 'Linux'
        run: |
          node scripts/pack-cli.js
          (cd out/npm && npm pack --dry-run)
          node out/npm/cli.js --version
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: '*.vsix'
