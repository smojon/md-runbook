name: CI
on:
  push:
    branches: ['**'] # not tags: the Release workflow tests tag pushes
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # Unit, round-trip, fuzz, redaction and shell smoke tests (pwsh + cmd natively on Windows).
      - run: npm test
      # The command-line runner end to end, through this repository's own GitHub Action.
      - name: Run a runbook with the command line
        uses: ./
        with:
          runbook: examples/ci.runbook.md
          out: ${{ runner.temp }}/runbook/ci.runbook.md
          report: ${{ runner.temp }}/runbook/report.html
          pdf: ${{ runner.temp }}/runbook/report.pdf
          junit: ${{ runner.temp }}/runbook/junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runbook-${{ matrix.os }}
          path: ${{ runner.temp }}/runbook/
      # End-to-end tests in a real VS Code.
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Package
        if: runner.os == 'Linux'
        run: npx vsce package
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: '*.vsix'
