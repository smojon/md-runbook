# First launch: the shared core works on the device (parser/writer round trip, RE2), the sample
# runbook opens and shows its cells with the saved output.
appId: dev.mdrunbook.app
name: smoke
---
- launchApp:
    clearState: true
- runFlow: subflows/dismiss-system-dialog.yaml
- extendedWaitUntil:
    visible:
      id: core-status
    timeout: 120000
- assertVisible: 'Core OK'
- assertVisible:
    id: open-runbook
- takeScreenshot: 01-runbooks
- runFlow: subflows/dismiss-system-dialog.yaml
- tapOn:
    id: runbook-sample
- extendedWaitUntil:
    visible:
      id: cell-1-output
    timeout: 30000
- assertVisible: '.*uptime.*'
# Markdown cells are rendered, not shown as source.
- assertVisible: 'Service'
- assertNotVisible: '## Service'
- tapOn:
    id: task-0
- takeScreenshot: 02-runbook
