# A cell runs over SSH on a real OpenSSH server (the runner's, see e2e/*-run.sh): the app's key is
# made on the device, its public key goes to the server through e2e/key-server.mjs, a host is
# added, the host key is trusted on first contact, the first cell of the sample runs and its new
# output block shows. SSH_HOST, SSH_PORT, SSH_USER and KEY_URL come from the command line
# (e2e/*-run.sh); defaults here would win over them.
appId: dev.mdrunbook.app
name: run-cell
---
- launchApp:
    clearState: true
- runFlow: subflows/dismiss-system-dialog.yaml
- extendedWaitUntil:
    visible:
      id: open-runbook
    timeout: 120000
- tapOn:
    id: hosts
# Making the key can take a while: on a busy CI simulator the Secure Enclave took over 60 s
# (4 failures, 2026-11-14 to 16). A pass returns as soon as the key shows.
- extendedWaitUntil:
    visible:
      id: app-public-key
      text: 'ecdsa-sha2-nistp256 .*'
    timeout: 180000
# Where the key is kept (the Secure Enclave or Android Keystore; the simulator on Apple Silicon has one).
- assertVisible:
    id: app-key-storage
- copyTextFrom:
    id: app-public-key
- runScript: scripts/authorize-key.js
- tapOn:
    id: add-host
- tapOn:
    id: host-name
- inputText: ci
- tapOn:
    id: host-hostname
- inputText: ${SSH_HOST}
- tapOn:
    id: host-port
- eraseText
- inputText: ${SSH_PORT}
- tapOn:
    id: host-username
- inputText: ${SSH_USER}
- hideKeyboard
- tapOn:
    id: host-save
# On iOS the tap on Save right after hiding the keyboard was lost twice: the form stayed
# (2026-11-14/15). Tap it again only if the form is still there 10 s later.
- extendedWaitUntil:
    notVisible:
      id: host-save
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: host-save
    commands:
      - tapOn:
          id: host-save
- extendedWaitUntil:
    visible:
      id: add-host
    timeout: 30000
- takeScreenshot: 03-hosts
# Back to the home screen the same way on both platforms: a relaunch (state is kept). Wait for
# the list as at the start: a tap while it was still loading didn't open the runbook (iOS,
# 2026-10-24).
- launchApp
- runFlow: subflows/dismiss-system-dialog.yaml
- extendedWaitUntil:
    visible:
      id: open-runbook
    timeout: 120000
- tapOn:
    id: runbook-sample
- extendedWaitUntil:
    visible:
      id: cell-1-run
    timeout: 30000
- tapOn:
    id: cell-1-run
- extendedWaitUntil:
    visible:
      id: trust-accept
    timeout: 60000
- assertVisible:
    id: trust-fingerprint
    text: 'SHA256:.*'
- takeScreenshot: 04-trust
- tapOn:
    id: trust-accept
- extendedWaitUntil:
    visible: 'Output · ✓ exit 0 .* just now'
    timeout: 60000
- assertVisible: '.*load average.*'
- takeScreenshot: 05-ran
# A line run: tap the first line, Run line 1; its output block says which lines ran.
- tapOn:
    id: cell-1-line-0
- tapOn:
    id: cell-1-line-0-run
- extendedWaitUntil:
    visible: 'Output · ✓ exit 0 · lines 1 .* just now'
    timeout: 60000
- assertVisible: '.*\$ uptime.*'
- takeScreenshot: 06-line-run
