plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.mdrunbook'
version = '1.0.0'

android {
  namespace "dev.mdrunbook.hardwarekey"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // The fingerprint or screen-lock prompt before a key that requires the user signs.
  implementation "androidx.biometric:biometric:1.1.0"
}
