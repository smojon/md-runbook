# The web app is one page: its routes (/open?..., /runbook/...) are answered with index.html,
# with status 200, as a link from a mail or a QR code expects.
server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # The bundles carry a hash in their names: kept until a new release names new ones.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    # The team library (README.md): the host's runbooks/ folder, read-only, which the app lists
    # under Team runbooks. nginx lists each folder as JSON for the app (autoindex_format json,
    # nginx 1.7.9 and later); an index.json there is read first. No folder: 404 (not the app's
    # page), and the app shows no library.
    location /runbooks/ {
        autoindex on;
        autoindex_format json;
        types {
            text/markdown md markdown;
            application/json json;
        }
        default_type text/plain;
        charset utf-8;
        charset_types text/markdown text/plain application/json;
        # Read again on every visit: a runbook changed on the server shows as an update.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
