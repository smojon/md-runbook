# The web app is one page: its routes (/open?..., /runbook/...) are answered with index.html,
# with status 200, as a link from a mail or a QR code expects.
server {
    listen 8080;
    root /usr/share/nginx/html;
    # No nginx version in the Server header or on error pages.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # The page's own policy (the meta tag in apps/mobile/public/index.html, word for word: the
    # Web image workflow compares them), plus what a meta tag can't say: no other site may show
    # the app in a frame, as a page could make you click Run on it (security review, 2026-11-16).
    # nginx drops these where a location adds headers of its own: repeated there.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss: ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*; media-src 'self' blob: mediastream:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    # The camera for QR codes (self); none of the other powerful features, for the app or a frame.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), display-capture=()" always;
    # A window the app opens to another site gets no handle on the app's window, nor it on theirs.
    add_header Cross-Origin-Opener-Policy same-origin always;
    # No Strict-Transport-Security: this container speaks plain http. The https front sends it
    # (README.md, the Caddyfile).

    location / {
        try_files $uri $uri/ /index.html;
    }
    # The bundles carry a hash in their names: kept until a new release names new ones.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    # The team library at /runbooks/ (README.md, library.conf).
    location /runbooks/ {
        include /etc/nginx/md-runbook-library.conf;
    }
    # The runtime configuration, written at start from the environment (40-md-runbook-config.sh):
    # the public address and the library folder, no secrets. Not there: 404, and the app uses
    # its defaults.
    location = /config.json {
        alias /tmp/md-runbook/config.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    # The library at MD_RUNBOOK_LIBRARY, when that is not /runbooks/ (none: nothing included).
    include /tmp/md-runbook/*.conf;
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss: ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*; media-src 'self' blob: mediastream:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), display-capture=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
    }
}
