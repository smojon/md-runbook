# The team library's rules (README.md), included by its location: /runbooks/ (nginx.conf), or
# the folder MD_RUNBOOK_LIBRARY names (40-md-runbook-config.sh writes that location). The host's
# folder, read-only, which the app lists under Team runbooks. nginx lists each folder as JSON for
# the app (autoindex_format json, nginx 1.7.9 and later); an index.json there is read first. No
# folder: 404 (not the app's page), and the app shows no library. Everything in the folder is
# public to whoever reaches this server, except hidden files and folders (a .git checkout, .env),
# which answer 404, and symbolic links to files of another owner (/etc/passwd), which are refused.
location ~ /\. {
    return 404;
}
disable_symlinks if_not_owner;
autoindex on;
autoindex_format json;
types {
    text/markdown md markdown;
    application/json json;
}
default_type text/plain;
charset utf-8;
charset_types text/markdown text/plain application/json;
# Read again on every visit: a runbook changed on the server shows as an update.
add_header Cache-Control "no-cache";
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
