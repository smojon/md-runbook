# /etc/md-runbook/gate.conf of the md-runbook ops host (the image's default). Replace the folder
# /etc/md-runbook with a read-only mount of your own gate.conf and allowed_signers: see README.md.

# Cells that are not signed (or changed since signing): refuse, or allow (still logged).
unsigned = refuse

# Signed runbooks for these scopes run here, space-separated; * = any.
scopes = *

# The publishers' keys (OpenSSH allowed_signers format, namespaces="md-runbook").
allowed_signers = /etc/md-runbook/allowed_signers

# How many distinct signers from allowed_signers a runbook needs (author and reviewer: 2).
signers = 1

# The container prints this file to its own output (docker logs, kubectl logs).
log = /var/log/md-runbook/gate.log
