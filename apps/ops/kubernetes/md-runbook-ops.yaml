# The md-runbook ops host inside your cluster. Each SSH session's blocks run in a Kubernetes Job
# of their own (cells_runner = kubernetes-job), as the service account md-runbook-cells: the
# roles below are all a runbook can do: read in every namespace, change only in the namespaces
# you bind. The ops pod's own account may only run those Jobs (and read one admission policy,
# md-runbook-ops-workloads). There is no kubeconfig to copy
# and no cloud key anywhere. Before `kubectl apply -f` this file, see apps/ops/README.md: your
# keys, your signers, and the cluster's name for kube-context:. Apply admission-policy.yaml
# with it. Applying this file again resets the ConfigMap and the Deployment to these samples:
# apply your edited copy.
apiVersion: v1
kind: Namespace
metadata:
  name: md-runbook-ops
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# The ops pod (sshd and md-runbook-gate). It holds none of the cells' rights.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: md-runbook-ops
  namespace: md-runbook-ops
---
# What the gate needs for each session's Job, in this namespace only: create, list and delete
# Jobs, find their pods, exec into them. The gate checks at each session that it has these
# rights and none of the cells' (else the session doesn't start). It also lists the pods and
# service accounts here: this namespace must hold the ops host alone (README.md). RBAC can't
# say which Jobs, nor which pods: admission-policy.yaml (apply it too) allows only the cells'.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: md-runbook-ops-jobs
  namespace: md-runbook-ops
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, list, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  # get too: kubectl exec over WebSockets asks for it on older clusters.
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: md-runbook-ops-jobs
  namespace: md-runbook-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: md-runbook-ops-jobs
subjects:
  - kind: ServiceAccount
    name: md-runbook-ops
    namespace: md-runbook-ops
---
# The gate's cluster-wide reads, for its checks once runbooks may change workloads somewhere
# (else it refuses sessions):
#   - the admission policy md-runbook-ops-workloads and its binding, by name
#     (admission-policy.yaml);
#   - the ClusterRoleBindings: it refuses a namespace whose service accounts have cluster-wide
#     rights (a runbook's image would run as them). `kubectl get clusterrolebindings` lists;
#     it needs no get.
# It checks at each session that it may do nothing more: get or change the policies, get or
# change any RBAC object, bind or escalate roles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: md-runbook-ops-gate
rules:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    resourceNames: [md-runbook-ops-workloads]
    verbs: [get]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: md-runbook-ops-gate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: md-runbook-ops-gate
subjects:
  - kind: ServiceAccount
    name: md-runbook-ops
    namespace: md-runbook-ops
---
# The sessions' Jobs: what their blocks may do in the cluster is this account's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: md-runbook-cells
  namespace: md-runbook-ops
---
# What runbooks may read, in every namespace: most things, not Secrets, ConfigMaps or pod logs.
# Those come with md-runbook-ops-operate, per namespace: in md-runbook-ops they are the gate's
# (its log, its policy).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: md-runbook-ops
rules:
  - apiGroups: ['']
    resources: [pods, services, endpoints, events, namespaces, nodes, persistentvolumeclaims, persistentvolumes, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  # cert-manager, where installed: which certificates are ready and when they expire.
  - apiGroups: [cert-manager.io]
    resources: [certificates, certificaterequests, issuers, clusterissuers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: md-runbook-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: md-runbook-ops
subjects:
  - kind: ServiceAccount
    name: md-runbook-cells
    namespace: md-runbook-ops
---
# What runbooks may change: restart, roll back and scale Deployments and StatefulSets; and read
# pod logs and ConfigMaps. Only in the namespaces you bind it in, each enforcing Pod Security
# baseline or restricted (else a block could start a privileged pod there, and own the node).
# Never cluster-wide, never in kube-* (the gate refuses both): whoever may change a namespace's
# workloads can read its Secrets and act as its service accounts (Kubernetes RBAC good
# practices, "Workload creation"). The admission policy md-runbook-ops-workloads keeps a patch
# from changing which service account a pod template runs as, its volumes and the like. A new
# image still runs as the account the workload has: the gate refuses a namespace whose accounts
# have cluster-wide bindings, not rights from RoleBindings. No DaemonSets: they run on every
# node, often privileged. Add
# rules for more (pods/exec, delete) once you need them: pods/exec lets a block read the token
# of every pod it execs into.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: md-runbook-ops-operate
rules:
  # kubectl rollout restart / undo, kubectl scale.
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [patch]
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [get, patch, update]
  # kubectl create job --from=cronjob/NAME: off. Warning: it lets runbooks run any pod in the
  # namespace, as any of its service accounts. md-runbook-ops-workloads narrows that to Jobs of a
  # CronJob, as the account default, without Secrets; their image and command are still the
  # runbook's. To opt in, uncomment:
  # - apiGroups: [batch]
  #   resources: [jobs]
  #   verbs: [create]
  # kubectl logs, kubectl get configmap
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, watch]
# One RoleBinding per namespace runbooks may change, for the cells' account, in a namespace that
# enforces Pod Security:
#   kubectl label namespace NAMESPACE pod-security.kubernetes.io/enforce=baseline
#   kubectl -n NAMESPACE create rolebinding md-runbook-ops-operate \
#     --clusterrole=md-runbook-ops-operate --serviceaccount=md-runbook-ops:md-runbook-cells
# Never in md-runbook-ops itself: blocks could then start a pod as the gate's account, or read
# its log and policy. Never in kube-*, nor where a controller with cluster-wide rights runs
# (argocd, flux-system, cert-manager, ...): README.md. The gate refuses to start a session if
# blocks can change md-runbook-ops or a kube-* namespace, if a namespace they can change doesn't
# enforce Pod Security, or if md-runbook-ops-workloads isn't bound.
---
# The gate's policy and the publishers' keys. unsigned = refuse runs signed runbooks only; set
# allow while you try it out (every cell is still logged).
apiVersion: v1
kind: ConfigMap
metadata:
  name: md-runbook-ops-gate
  namespace: md-runbook-ops
data:
  gate.conf: |
    unsigned = refuse
    scopes = *
    allowed_signers = /etc/md-runbook/allowed_signers
    signers = 1
    log = /var/log/md-runbook/gate.log
    sshd_force_command = yes
    kill_leftovers = yes
    cells_runner = kubernetes-job
    job_service_account = md-runbook-cells
    # Run reports: the token in the Secret md-runbook-ops-report-token, never in this ConfigMap.
    # report_to = https://runbooks.example.net/v1/runs
    # report_token_file = /etc/md-runbook-ops/report/token
  # One line per publisher: `you@example.net namespaces="md-runbook" ssh-ed25519 AAAA…`
  # (VS Code: Sign Runbook shows it; the app: Hosts & settings → Signing runbooks).
  allowed_signers: ''
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: md-runbook-ops
  namespace: md-runbook-ops
  labels:
    app.kubernetes.io/name: md-runbook-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: md-runbook-ops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: md-runbook-ops
    spec:
      serviceAccountName: md-runbook-ops
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ops
          # Published with each md-runbook release; pin one (:0.11.0) once you rely on it.
          image: ghcr.io/smojon/md-runbook-ops:latest
          imagePullPolicy: IfNotPresent
          env:
            # The context name kubectl reports here and in each session's Job: what runbooks
            # write as kube-context:.
            - name: CLUSTER_NAME
              value: my-cluster
          ports:
            - name: ssh
              containerPort: 2222
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - { name: keys, mountPath: /etc/md-runbook-ops/keys, readOnly: true }
            - { name: hostkey, mountPath: /etc/md-runbook-ops/hostkey, readOnly: true }
            - { name: report, mountPath: /etc/md-runbook-ops/report, readOnly: true }
            - { name: gate, mountPath: /etc/md-runbook, readOnly: true }
            - { name: home, mountPath: /home/ops }
            - { name: tmp, mountPath: /tmp }
            - { name: run, mountPath: /run/md-runbook-ops }
            - { name: state, mountPath: /var/lib/md-runbook-ops }
            - { name: log, mountPath: /var/log/md-runbook }
      volumes:
        # kubectl -n md-runbook-ops create configmap md-runbook-ops-keys --from-file=authorized_keys
        - name: keys
          configMap:
            name: md-runbook-ops-keys
            optional: true
        # kubectl -n md-runbook-ops create secret generic md-runbook-ops-hostkey --from-file=ssh_host_ecdsa_key
        - name: hostkey
          secret:
            secretName: md-runbook-ops-hostkey
            optional: true
            defaultMode: 0440
        # Run reports' bearer token (report_token_file in gate.conf), out of the blocks' reach:
        # kubectl -n md-runbook-ops create secret generic md-runbook-ops-report-token --from-file=token
        - name: report
          secret:
            secretName: md-runbook-ops-report-token
            optional: true
            defaultMode: 0440
        - name: gate
          configMap:
            name: md-runbook-ops-gate
        - { name: home, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: run, emptyDir: { medium: Memory } }
        - { name: state, emptyDir: {} }
        # The gate's log grows by about 0.5 KB per event and isn't rotated: 256Mi holds some
        # 500,000 events, years of sessions. Over it, the kubelet evicts the pod (a new one
        # starts with an empty log) rather than fill the node's disk. Every line is also on the
        # container's output (kubectl logs): rely on that copy.
        - name: log
          emptyDir:
            sizeLimit: 256Mi
---
# Inside the cluster only. For the app on a phone: a LoadBalancer (see README.md), a VPN, or
# the relay next to it for the web app.
apiVersion: v1
kind: Service
metadata:
  name: md-runbook-ops
  namespace: md-runbook-ops
spec:
  selector:
    app.kubernetes.io/name: md-runbook-ops
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
---
# The sessions' Job pods take no connection: not from each other, not from anything else.
# (kubectl exec reaches them through the kubelet, not the pod network.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: md-runbook-cells
  namespace: md-runbook-ops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: md-runbook-cells
  policyTypes: [Ingress]
---
# sshd of the ops pod: from other namespaces, from this one's other pods, and from outside the
# cluster (a LoadBalancer, a VPN), not from the sessions' Job pods. Some network plugins also
# apply an ipBlock to pod addresses: there the Job pods can still reach sshd (they have no key).
# Egress stays open; cells-egress.yaml closes it for the Job pods, ops-egress.yaml for this pod
# (both opt-in: the cloud's metadata address, other namespaces, the internet).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: md-runbook-ops
  namespace: md-runbook-ops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: md-runbook-ops
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 2222
      from:
        - namespaceSelector:
            matchExpressions:
              - { key: kubernetes.io/metadata.name, operator: NotIn, values: [md-runbook-ops] }
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: NotIn, values: [md-runbook-cells] }
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
