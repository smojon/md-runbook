# /etc/md-runbook/gate.conf of the md-runbook ops host (the image's default). Replace the folder
# /etc/md-runbook with a read-only mount of your own gate.conf and allowed_signers: see README.md.

# Cells that are not signed (or changed since signing): refuse, or allow (still logged).
unsigned = refuse

# Signed runbooks for these scopes run here, space-separated; * = any.
scopes = *

# The publishers' keys (OpenSSH allowed_signers format, namespaces="md-runbook").
allowed_signers = /etc/md-runbook/allowed_signers

# How many distinct signers from allowed_signers a runbook needs (author and reviewer: 2).
signers = 1

# The container prints this file to its own output (docker logs, kubectl logs).
log = /var/log/md-runbook/gate.log

# sshd_config's ForceCommand runs the gate for every login (the key lines have no command=).
sshd_force_command = yes

# At the start and end of each session, end the processes of ops that outlived their session
# (a block's setsid or double-forked program), before they reach a later session's shell.
# Best-effort against a fork loop that also leaves its process group each time (see
# apps/gate/README.md).
kill_leftovers = yes

# Each session's blocks run in a Kubernetes Job of their own, as this service account: they
# can't reach the gate's pod, its log or the other sessions. Needs the RBAC of
# kubernetes/md-runbook-ops.yaml. Outside a cluster (docker, compose): remove both lines.
cells_runner = kubernetes-job
job_service_account = md-runbook-cells

# The Kubernetes audit log names who ran each block (kubernetes/impersonation.yaml first; see
# docs/features/kubernetes.md, "Who in the Kubernetes audit log").
# job_audit_who = yes
