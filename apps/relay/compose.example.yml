# The relay behind Caddy, which gets and renews a TLS certificate for relay.example.net, so the
# web app connects to wss://relay.example.net. Copy this file and Caddyfile.example, put your own
# name, token and targets in, then `docker compose up -d`.
#
# The token: `openssl rand -base64 32`, kept in relay-token.txt next to this file (not in Git).
services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      RELAY_TOKEN_FILE: /run/secrets/relay_token
      # The SSH servers the relay may reach, host:port, comma-separated.
      RELAY_TARGETS: web1.example.net:22,web2.example.net:22
      # The pages allowed to connect: where your md-runbook web app is served.
      RELAY_ORIGINS: https://runbooks.example.net
      # Caddy is the only client the relay sees; the browser's address comes from Caddy's header.
      RELAY_TRUST_PROXY: '1'
    secrets: [relay_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # Not published: only Caddy reaches it.
    expose: ['8022']

  # The ops host next to the relay (apps/ops): `docker compose --profile ops up -d`. The relay
  # reaches it as ops:2222 (add it to RELAY_TARGETS); phones connect to this machine's port 2222.
  # Its files are in ./ops (see apps/ops/README.md): keys/authorized_keys, gate/gate.conf,
  # gate/allowed_signers, kubeconfig/config (outside a cluster, kubectl's login).
  ops:
    profiles: [ops]
    build:
      context: ..
      dockerfile: ops/Dockerfile
    restart: unless-stopped
    ports: ['2222:2222']
    volumes:
      - ./ops/keys:/etc/md-runbook-ops/keys:ro
      - ./ops/gate:/etc/md-runbook:ro
      - ./ops/kubeconfig:/etc/md-runbook-ops/kubeconfig:ro
      # The host key the app trusts, kept across rebuilds.
      - ops-state:/var/lib/md-runbook-ops
    tmpfs:
      - /tmp:mode=1777
      - /run/md-runbook-ops:uid=10001,gid=10001,mode=0700
      - /var/log/md-runbook:uid=10001,gid=10001,mode=0700
      - /home/ops:uid=10001,gid=10001,mode=0700
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

secrets:
  relay_token:
    file: ./relay-token.txt

volumes:
  caddy-data:
  ops-state:
