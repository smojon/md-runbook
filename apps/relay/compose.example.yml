# The relay behind Caddy, which gets and renews a TLS certificate for relay.example.net, so the
# web app connects to wss://relay.example.net. Copy this file and Caddyfile.example, put your own
# name, token and targets in, then `docker compose up -d`.
#
# The token: `openssl rand -base64 32`, kept in relay-token.txt next to this file (not in Git).
services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      RELAY_TOKEN_FILE: /run/secrets/relay_token
      # The SSH servers the relay may reach, host:port, comma-separated.
      RELAY_TARGETS: web1.example.net:22,web2.example.net:22
      # The pages allowed to connect: where your md-runbook web app is served.
      RELAY_ORIGINS: https://runbooks.example.net
      # Caddy is the only client the relay sees; the browser's address comes from Caddy's header.
      RELAY_TRUST_PROXY: '1'
    secrets: [relay_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # Not published: only Caddy reaches it.
    expose: ['8022']

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

secrets:
  relay_token:
    file: ./relay-token.txt

volumes:
  caddy-data:
