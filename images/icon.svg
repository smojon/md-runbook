<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Markdown Runbook: a list of steps whose bullets are play buttons. Source of truth for icon.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5bd6"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- play bullets -->
  <g fill="#4ade80" stroke="#4ade80" stroke-width="12" stroke-linejoin="round">
    <path d="M50 51 L84 70 L50 89 Z"/>
    <path d="M50 109 L84 128 L50 147 Z"/>
    <path d="M50 167 L84 186 L50 205 Z"/>
  </g>
  <!-- step text lines -->
  <g fill="#ffffff">
    <rect x="110" y="55"  width="104" height="30" rx="15"/>
    <rect x="110" y="113" width="80"  height="30" rx="15"/>
    <rect x="110" y="171" width="96"  height="30" rx="15"/>
  </g>
</svg>
